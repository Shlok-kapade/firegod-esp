; FireGod-ESP — PlatformIO Configuration
; Target: ESP32-D0WD rev 1.0 (4MB flash, no PSRAM)

[platformio]
default_envs = firegod-esp32

[env:firegod-esp32]
platform = espressif32@~6.9.0
board = esp32dev
framework = arduino

; CPU & Flash
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = no_ota.csv

; Pre-build: gzip + embed web/* into src/data/web_assets.h
extra_scripts = pre:scripts/embed_web.py

; Upload
upload_port = /dev/ttyUSB0
upload_speed = 921600

; Monitor
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; Build flags
build_flags =
    -DFIREGOD_VERSION='"0.1.0"'
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -Wall
    -Wno-unused-variable
    -Wno-unused-function
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    ; Phase 2 raw 802.11 injection: route the sanity-check gate to our stub.
    -Wl,--wrap=ieee80211_raw_frame_sanity_check

; Source structure
src_dir = src
include_dir = src

; Libraries
lib_deps =
    ESP32Async/AsyncTCP@^3.3
    ESP32Async/ESPAsyncWebServer@^3.6
    bblanchon/ArduinoJson@^7.4
    h2zero/NimBLE-Arduino@^2.5
